<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentStroke" x1="80" y1="80" x2="320" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect width="400" height="400" fill="url(#glow)" />

  <!-- Subtle blueprint rings -->
  <circle cx="200" cy="200" r="158" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="126" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1" />

  <!-- Minimalist portrait silhouette -->
  <circle cx="200" cy="146" r="46" fill="#131c2e" stroke="url(#accentStroke)" stroke-width="2" />
  <path
    d="M112 318C112 260 151.399 224 200 224C248.601 224 288 260 288 318"
    fill="#131c2e"
    stroke="url(#accentStroke)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Monogram badge -->
  <rect x="164" y="256" width="72" height="30" rx="15" fill="#07090e" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2" />
  <text
    x="200"
    y="276"
    text-anchor="middle"
    fill="#f1f5f9"
    font-family="monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="2"
  >AP</text>
</svg>
